<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Heim Scripts</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        h1 {
            color: #00ff88;
        }
        .box {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            margin: auto;
        }
        textarea {
            width: 100%;
            height: 250px;
            background: #000;
            color: #00ff88;
            border: none;
            padding: 10px;
            resize: none;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #00ff88;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>SpeedhubX Scripts</h1>

<div class="box">
    <h2>Grow a Garden 2🌱</h2>
    <textarea id="script" readonly>
loadstring(game:HttpGet("https://raw.githubusercontent.com/goatdkai/prolifter/refs/heads/main/Prolifter.lua"))()
    </textarea>
    <br>
    <button onclick="copyScript()">Copy Script</button>
</div>

<script>
function copyScript() {
    const text = document.getElementById("script");
    text.select();
    document.execCommand("copy");
    alert("Script copied!");
}
</script>

</body>
</html>
